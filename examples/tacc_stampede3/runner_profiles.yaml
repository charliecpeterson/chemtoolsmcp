# chemtools runner profiles for TACC Stampede3
#
# Place this file somewhere on Stampede3, e.g.:
#   ~/.config/chemtools/runner_profiles.yaml
#
# Then tell the MCP server where to find it:
#   export CHEMTOOLS_RUNNER_PROFILES=~/.config/chemtools/runner_profiles.yaml
#
# Edit programs.nwchem.executable_argv to match your NWChem installation.
# Hardware fields (cores_per_node, node_memory_mb, etc.) describe the machine
# and are used by suggest_nwchem_resources to auto-pick optimal resources.

schema_version: "1.0"

profiles:

  stampede3_skx:
    description: >
      Stampede3 SKX — 48 cores, 192 GB DDR4.
      Default profile for most DFT/SCF/TCE jobs.
    launcher: &tacc_launcher
      kind: "scheduler"
      submit_command: "sbatch"
      scheduler_type: "slurm"
      job_id_regex: "Submitted batch job (\\d+)"
      status_command: "squeue -j {job_id} -h -o %T"
      cancel_command: "scancel {job_id}"
    scheduler: &tacc_scheduler
      system: "slurm"
      script_template: &tacc_script |
        #!/bin/bash
        #SBATCH -J {job_name}
        #SBATCH -o {output_file}
        #SBATCH -e {error_file}
        #SBATCH -p {partition}
        #SBATCH -N {nodes}
        #SBATCH -n {mpi_ranks}
        #SBATCH -t {walltime}
        {account_line}
        {module_block}
        cd {job_dir}
        {pre_run_block}
        {program_command} {input_file}
      submit_script_name: "{job_name}.job"
    programs: &tacc_nwchem_programs
      nwchem:
        launcher_argv: ["ibrun"]
        executable_argv: ["nwchem"]
    execution: &tacc_execution
      shell: "/bin/bash"
    resources:
      nodes: 1
      mpi_ranks: 48
      omp_threads: 1
      walltime: "24:00:00"
      partition: "skx"
      account: null
      account_command: "/usr/local/etc/taccinfo"
      cores_per_node: 48
      node_memory_mb: 192000
      max_nodes: 256
      max_walltime: "48:00:00"
      cpu_arch: "skx"
    modules: &tacc_modules
      purge_first: false
      load: []
    env: {}
    hooks: &tacc_hooks_default
      pre_run: []
    file_rules: &tacc_file_rules
      output_file: "{job_name}.out"
      error_file: "{job_name}.err"
      restart_prefix: "{job_name}"

  stampede3_skx_dev:
    description: >
      Stampede3 SKX dev queue — 2-hour max, priority access.
      Use for short test runs before production.
    launcher: *tacc_launcher
    scheduler: *tacc_scheduler
    programs: *tacc_nwchem_programs
    execution: *tacc_execution
    resources:
      nodes: 1
      mpi_ranks: 48
      omp_threads: 1
      walltime: "2:00:00"
      partition: "skx-dev"
      account: null
      account_command: "/usr/local/etc/taccinfo"
      cores_per_node: 48
      node_memory_mb: 192000
      max_nodes: 16
      max_walltime: "2:00:00"
      cpu_arch: "skx"
    modules: *tacc_modules
    env: {}
    hooks: *tacc_hooks_default
    file_rules: *tacc_file_rules

  stampede3_icx:
    description: >
      Stampede3 ICX — 80 cores, 256 GB DDR4.
      Most memory per node. Use for memory-hungry methods.
    launcher: *tacc_launcher
    scheduler: *tacc_scheduler
    programs: *tacc_nwchem_programs
    execution: *tacc_execution
    resources:
      nodes: 1
      mpi_ranks: 80
      omp_threads: 1
      walltime: "24:00:00"
      partition: "icx"
      account: null
      account_command: "/usr/local/etc/taccinfo"
      cores_per_node: 80
      node_memory_mb: 256000
      max_nodes: 32
      max_walltime: "48:00:00"
      cpu_arch: "icx"
    modules: *tacc_modules
    env: {}
    hooks: *tacc_hooks_default
    file_rules: *tacc_file_rules

  stampede3_spr:
    description: >
      Stampede3 SPR — 112 cores, 128 GB HBM.
      Compute-bound only. Low memory/core (1.1 GB/core).
    launcher: *tacc_launcher
    scheduler: *tacc_scheduler
    programs: *tacc_nwchem_programs
    execution: *tacc_execution
    resources:
      nodes: 1
      mpi_ranks: 112
      omp_threads: 1
      walltime: "24:00:00"
      partition: "spr"
      account: null
      account_command: "/usr/local/etc/taccinfo"
      cores_per_node: 112
      node_memory_mb: 128000
      max_nodes: 32
      max_walltime: "48:00:00"
      cpu_arch: "spr"
    modules: *tacc_modules
    env: {}
    hooks:
      pre_run:
        - "export LD_LIBRARY_PATH=$(echo $LD_LIBRARY_PATH | tr ':' '\\n' | grep -v /opt/apps/python | tr '\\n' ':')"
    file_rules: *tacc_file_rules

  # ==========================================================================
  # Molcas / OpenMolcas profiles
  #
  # Stage the apptainer image to TACC first (e.g.
  # ``scp ~/mycontainers/openmolcas-26.02.sif stampede3:$WORK/containers/``)
  # then update ``programs.molcas.launcher_argv`` to the on-TACC path.
  #
  # Typed live execution reads command arrays from programs.molcas,
  # module setup from modules, and scratch setup from hooks.pre_run.
  # scheduler.script_template remains for dry-run compatibility.
  # ==========================================================================

  stampede3_molcas_skx:
    description: >
      OpenMolcas on Stampede3 SKX — 48 cores, 192 GB. Default for CASSCF /
      CASPT2 / RASSCF jobs. Container path is a placeholder — edit
      programs.molcas.launcher_argv after staging the .sif.
    launcher: *tacc_launcher
    scheduler:
      system: "slurm"
      script_template: &tacc_molcas_script |
        #!/bin/bash
        #SBATCH -J {job_name}
        #SBATCH -o {output_file}
        #SBATCH -e {error_file}
        #SBATCH -p {partition}
        #SBATCH -N {nodes}
        #SBATCH -n {mpi_ranks}
        #SBATCH -t {walltime}
        {account_line}

        module load tacc-apptainer

        cd {job_dir}
        export MOLCAS_PROJECT="{job_name}_$SLURM_JOB_ID"
        export MOLCAS_WORKDIR="$SCRATCH/molcas/$MOLCAS_PROJECT"
        mkdir -p "$MOLCAS_WORKDIR"
        export MOLCAS_MEM=8000   # MB per worker — set to (node_memory_mb / mpi_ranks)

        {program_command} -np {mpi_ranks} {input_file}
      submit_script_name: "{job_name}.job"
    programs:
      molcas:
        launcher_argv:
          - "apptainer"
          - "exec"
          - "$WORK/containers/openmolcas-26.02.sif"   # EDIT ME
        executable_argv: ["pymolcas"]
        parallel_caspt2_supported: false
    execution:
      env: {}
    resources:
      nodes: 1
      mpi_ranks: 48
      omp_threads: 1
      walltime: "24:00:00"
      partition: "skx"
      account: null
      account_command: "/usr/local/etc/taccinfo"
      cores_per_node: 48
      node_memory_mb: 192000
      max_nodes: 256
      max_walltime: "48:00:00"
      cpu_arch: "skx"
    modules: &tacc_molcas_modules
      purge_first: false
      load:
        - "tacc-apptainer"
    env: {}
    hooks: &tacc_molcas_hooks
      pre_run:
        - 'export MOLCAS_WORKDIR="$SCRATCH/molcas/$MOLCAS_PROJECT"'
        - 'mkdir -p "$MOLCAS_WORKDIR"'
        - "export MOLCAS_MEM=8000"
    file_rules:
      output_file: "{job_name}.log"      # Molcas uses .log not .out
      error_file: "{job_name}.err"
      restart_prefix: "{job_name}"

  stampede3_molcas_skx_dev:
    description: >
      Molcas on Stampede3 SKX dev queue — 2 h max, priority. For
      quick CASSCF tests before production submission.
    launcher: *tacc_launcher
    scheduler:
      system: "slurm"
      script_template: *tacc_molcas_script
      submit_script_name: "{job_name}.job"
    programs:
      molcas:
        launcher_argv:
          - "apptainer"
          - "exec"
          - "$WORK/containers/openmolcas-26.02.sif"
        executable_argv: ["pymolcas"]
        parallel_caspt2_supported: false
    execution:
      env: {}
    resources:
      nodes: 1
      mpi_ranks: 48
      omp_threads: 1
      walltime: "2:00:00"
      partition: "skx-dev"
      account: null
      account_command: "/usr/local/etc/taccinfo"
      cores_per_node: 48
      node_memory_mb: 192000
      max_nodes: 16
      max_walltime: "2:00:00"
      cpu_arch: "skx"
    modules: *tacc_molcas_modules
    env: {}
    hooks: *tacc_molcas_hooks
    file_rules:
      output_file: "{job_name}.log"
      error_file: "{job_name}.err"
      restart_prefix: "{job_name}"

  # ==========================================================================
  # DIRAC profiles
  #
  # Typed live execution reads command arrays from programs.dirac, plus
  # target-wide modules and hooks. pam-dirac handles MPI through --mpi=N, so
  # profiles do not use ibrun. script_template remains for dry-run
  # compatibility.
  # ==========================================================================

  stampede3_dirac_skx:
    description: >
      DIRAC 25 on Stampede3 SKX — 48 cores, 192 GB. Default for 4c-DHF,
      X2C-MP2, KR-CCSD, and atomic AOC runs. Container path is a
      placeholder. Edit programs.dirac.launcher_argv after staging the .sif.
    launcher: *tacc_launcher
    scheduler:
      system: "slurm"
      script_template: &tacc_dirac_script |
        #!/bin/bash
        #SBATCH -J {job_name}
        #SBATCH -o {output_file}
        #SBATCH -e {error_file}
        #SBATCH -p {partition}
        #SBATCH -N {nodes}
        #SBATCH -n {mpi_ranks}
        #SBATCH -t {walltime}
        {account_line}

        module load tacc-apptainer

        cd {job_dir}
        # DIRAC's pam-dirac orchestrates its own MPI launch; we do NOT use ibrun.
        {program_command} \
            --mpi={mpi_ranks} \
            --inp={input_file} \
            --mol={mol_file}
      submit_script_name: "{job_name}.job"
    programs:
      dirac:
        launcher_argv:
          - "apptainer"
          - "exec"
          - "$WORK/containers/dirac-25.0.sif"   # EDIT ME
        executable_argv: ["pam-dirac"]
        default_mpi: 48
        default_mw: 256
        default_nw: 256
    resources:
      nodes: 1
      mpi_ranks: 48
      omp_threads: 1
      walltime: "24:00:00"
      partition: "skx"
      account: null
      account_command: "/usr/local/etc/taccinfo"
      cores_per_node: 48
      node_memory_mb: 192000
      max_nodes: 256
      max_walltime: "48:00:00"
      cpu_arch: "skx"
    modules: &tacc_dirac_modules
      purge_first: false
      load:
        - "tacc-apptainer"
    env: {}
    hooks: *tacc_hooks_default
    file_rules:
      output_file: "{job_name}.out"
      error_file: "{job_name}.err"
      restart_prefix: "{job_name}"

  stampede3_dirac_icx:
    description: >
      DIRAC on Stampede3 ICX — 80 cores, 256 GB. Best when you need raw
      memory per node (large basis 4c-CCSD, big actinide systems).
    launcher: *tacc_launcher
    scheduler:
      system: "slurm"
      script_template: *tacc_dirac_script
      submit_script_name: "{job_name}.job"
    programs:
      dirac:
        launcher_argv:
          - "apptainer"
          - "exec"
          - "$WORK/containers/dirac-25.0.sif"
        executable_argv: ["pam-dirac"]
        default_mpi: 80
        default_mw: 512
        default_nw: 512
    resources:
      nodes: 1
      mpi_ranks: 80
      omp_threads: 1
      walltime: "24:00:00"
      partition: "icx"
      account: null
      account_command: "/usr/local/etc/taccinfo"
      cores_per_node: 80
      node_memory_mb: 256000
      max_nodes: 32
      max_walltime: "48:00:00"
      cpu_arch: "icx"
    modules: *tacc_dirac_modules
    env: {}
    hooks: *tacc_hooks_default
    file_rules:
      output_file: "{job_name}.out"
      error_file: "{job_name}.err"
      restart_prefix: "{job_name}"

  # ==========================================================================
  # GRASP2018 profiles
  #
  # GRASP is structurally different from the other programs: it runs many
  # small executables in one shell workflow. Typed live execution runs that
  # workflow inside the configured container. script_template remains for
  # dry-run compatibility and shows the same command.
  #
  # Atomic GRASP calculations are typically serial (a few cores at most);
  # multi-node parallelism via rmcdhf_mpi / rci_mpi is rare. We default to
  # 1 node, 48 ranks.
  # ==========================================================================

  stampede3_grasp_skx:
    description: >
      GRASP2018 on Stampede3 SKX — 48 cores, 192 GB. The whole DHF
      workflow (rnucleus → rcsfgenerate → rangular → rwfnestimate →
      rmcdhf → rsave → jj2lsj → rlevels) runs inside one sbatch via the
      script_template. Container path is a placeholder.
    launcher: *tacc_launcher
    scheduler:
      system: "slurm"
      script_template: |
        #!/bin/bash
        #SBATCH -J {job_name}
        #SBATCH -o {output_file}
        #SBATCH -e {error_file}
        #SBATCH -p {partition}
        #SBATCH -N {nodes}
        #SBATCH -n {mpi_ranks}
        #SBATCH -t {walltime}
        {account_line}

        module load tacc-apptainer

        cd {job_dir}
        # The workflow contains the ordered GRASP commands and heredocs.
        # Run the whole script inside the container so plain commands such
        # as rnucleus and rmcdhf resolve to the container installation.
        {program_command} {input_file}
      submit_script_name: "{job_name}.job"
    programs:
      grasp:
        launcher_argv:
          - "apptainer"
          - "exec"
          - "$WORK/containers/grasp2018.sif"   # EDIT ME
        executable_argv: ["bash"]
    resources:
      nodes: 1
      mpi_ranks: 48
      omp_threads: 1
      walltime: "12:00:00"
      partition: "skx"
      account: null
      account_command: "/usr/local/etc/taccinfo"
      cores_per_node: 48
      node_memory_mb: 192000
      max_nodes: 256
      max_walltime: "48:00:00"
      cpu_arch: "skx"
    modules: &tacc_grasp_modules
      purge_first: false
      load:
        - "tacc-apptainer"
    env: {}
    hooks: *tacc_hooks_default
    file_rules:
      output_file: "{job_name}.out"
      error_file: "{job_name}.err"
      restart_prefix: "{job_name}"

  stampede3_grasp_skx_dev:
    description: >
      GRASP on Stampede3 SKX dev queue — 2 h max. For test atomic SCF
      runs (Li, Be, light atoms converge in seconds).
    launcher: *tacc_launcher
    scheduler:
      system: "slurm"
      script_template: |
        #!/bin/bash
        #SBATCH -J {job_name}
        #SBATCH -o {output_file}
        #SBATCH -e {error_file}
        #SBATCH -p {partition}
        #SBATCH -N {nodes}
        #SBATCH -n {mpi_ranks}
        #SBATCH -t {walltime}
        {account_line}

        module load tacc-apptainer

        cd {job_dir}
        {program_command} {input_file}
      submit_script_name: "{job_name}.job"
    programs:
      grasp:
        launcher_argv:
          - "apptainer"
          - "exec"
          - "$WORK/containers/grasp2018.sif"
        executable_argv: ["bash"]
    resources:
      nodes: 1
      mpi_ranks: 48
      omp_threads: 1
      walltime: "2:00:00"
      partition: "skx-dev"
      account: null
      account_command: "/usr/local/etc/taccinfo"
      cores_per_node: 48
      node_memory_mb: 192000
      max_nodes: 16
      max_walltime: "2:00:00"
      cpu_arch: "skx"
    modules: *tacc_grasp_modules
    env: {}
    hooks: *tacc_hooks_default
    file_rules:
      output_file: "{job_name}.out"
      error_file: "{job_name}.err"
      restart_prefix: "{job_name}"

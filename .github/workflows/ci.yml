# Lint + test gate. The pyflakes bug-class checks catch real defects, not style:
# F821 undefined names (shipped latent NameErrors), F811 redefinitions (shadowed
# imports / dead re-defs), F841 unused locals (dead code / parsed-but-dropped
# values). The committed tests/ subset is self-contained (no local training
# corpus). F401 import-noise is intentionally not gated (the api re-export shims).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff
      - name: Lint — pyflakes bug classes (undefined / redefined / unused)
        run: ruff check --select F821,F811,F841 chemtools/
      - name: Test
        run: pytest tests/ -q

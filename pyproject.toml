[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemtools-mcp"
version = "0.1.0"
description = "AI agent toolkit for computational chemistry — MCP server for NWChem, Molcas (and more), with per-program tool filtering"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    # Runner profiles and example configs ship as YAML; loading a .yaml
    # profile (or the bundled examples) needs a YAML parser. JSON profiles
    # work without it, but the default examples include .yaml.
    "pyyaml",
]

[project.optional-dependencies]
# DIRAC support: reading .h5 checkpoints requires h5py.
dirac = ["h5py>=3.0"]

[project.urls]
Repository = "https://github.com/charliecpeterson/chemtoolsmcp"
Issues     = "https://github.com/charliecpeterson/chemtoolsmcp/issues"

[project.scripts]
chemtools             = "chemtools.mcp.cli:main"
chemtools-nwchem      = "chemtools.mcp.cli:main_legacy_nwchem"
chemtools-nwchem-docs = "chemtools.mcp.nwchem_docs:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["chemtools*"]

[tool.setuptools.package-data]
# Bundle per-program data (basis libraries, docs) and the bundled
# per-program example corpora.
chemtools = [
    "data/**/*",
    "programs/*/data/**/*",
    "programs/*/examples/*.nw",
    "programs/*/examples/*.json",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemtools-mcp"
version = "0.2.0.dev0"
description = "AI agent toolkit for computational chemistry — MCP server for NWChem, Molcas (and more), with per-program tool filtering"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    # Pin the protocol implementation so MCP behavior changes are deliberate.
    "mcp==2.0.0",
    # Required by installed analysis modules, including NWChem binary/TCE
    # parsing and QE geometry handling.
    "numpy",
    # Guided knowledge cards are YAML. Runner profiles also accept YAML.
    "pyyaml",
]

[project.optional-dependencies]
# Text parsing and input drafting remain available without this extra.
# Reading DIRAC .h5 checkpoints in the MCP process requires h5py.
dirac = ["h5py>=3.0"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/charliecpeterson/chemtoolsmcp"
Issues     = "https://github.com/charliecpeterson/chemtoolsmcp/issues"

[project.scripts]
chemtools             = "chemtools.mcp.cli:main"
chemtools-nwchem      = "chemtools.mcp.cli:main_legacy_nwchem"
chemtools-nwchem-docs = "chemtools.mcp.nwchem_docs:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["chemtools*"]

[tool.setuptools.package-data]
# Bundle per-program data (basis libraries, docs) and the bundled
# per-program example corpora.
chemtools = [
    "case_schema.json",
    "case_template.json",
    "runner_profiles.example.json",
    "runner_profiles.example.yaml",
    "runner_profiles.local.example.json",
    "runner_profiles.slurm.example.yaml",
    "execution_targets.example.yaml",
    "data/**/*",
    "programs/*/data/**/*",
    "programs/*/examples/*.nw",
    "programs/*/examples/*.json",
]
